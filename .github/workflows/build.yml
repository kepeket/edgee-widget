name: Build EdgeeWidget

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify pinned Swift 6 toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version

      - name: Run Swift tests
        run: swift test

      - name: Build macOS app bundle
        env:
          SIGN_IDENTITY: "-"
        run: ./scripts/build-app.sh --release --universal

      - name: Verify signed bundle and branding resources
        run: |
          codesign --verify --deep --strict build/universal/Edgee.app
          brand_resources=build/universal/Edgee.app/Contents/Resources/EdgeeWidget_EdgeeWidget.bundle
          if [ -d "$brand_resources/Contents/Resources" ]; then
            brand_resources="$brand_resources/Contents/Resources"
          fi
          test -f "$brand_resources/EdgeeMark.pdf"
          test -f "$brand_resources/EdgeeWordmark.pdf"

      - name: Build unsigned review installer
        run: ./scripts/package-app.sh --unsigned

      - name: Verify distribution payload
        run: ./scripts/verify-package.sh dist/*-unsigned.pkg

      - name: Archive matching source
        run: |
          git archive --format=tar.gz --prefix=edgee-pulse/ --output=dist/Edgee-Pulse-source.tar.gz HEAD
          cd dist
          shasum -a 256 Edgee-Pulse-source.tar.gz >> SHA256SUMS

      - name: Upload review distribution
        uses: actions/upload-artifact@v4
        with:
          name: Edgee-Pulse-unsigned-review
          path: dist/
