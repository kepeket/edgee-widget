name: Build EdgeeWidget

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run Swift tests
        run: swift test

      - name: Build macOS app bundle
        env:
          SIGN_IDENTITY: "-"
        run: ./scripts/build-app.sh --release

      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/Edgee.app EdgeeWidget-macOS.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeeWidget-macOS
          path: EdgeeWidget-macOS.zip
